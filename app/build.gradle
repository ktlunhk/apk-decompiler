apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    buildToolsVersion "28.0.3"

    defaultConfig {
        applicationId "com.mydecompilers"
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 5
        versionName "1.4"
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    // Every library is a plain jar in app/libs - no androidx / support libraries.
    compile fileTree(dir: 'libs', include: ['*.jar'])
}
